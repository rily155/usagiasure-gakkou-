<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ジャンプゲーム 操作説明</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e7f6ff,#fff4d8);font-family:system-ui,sans-serif;color:#333;padding:20px}.panel{width:min(760px,100%);background:#fff;border-radius:20px;padding:clamp(22px,5vw,42px);box-shadow:0 10px 35px #0002}h1{text-align:center;color:#347ca5;margin-top:0}.page{display:none;min-height:260px}.page.active{display:block}h2{color:#d47c28}.item{font-size:1.15rem;line-height:1.9;background:#f7fbff;padding:16px;border-radius:12px;margin:12px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}button{border:0;border-radius:10px;padding:12px 20px;font-size:1rem;cursor:pointer;background:#4c91bb;color:white}button:disabled{opacity:.35;cursor:default}.dots{letter-spacing:8px;color:#bbb}.dots span.active{color:#e6a33b}.finish{background:#4b9b63;font-weight:bold}
</style></head><body><main class="panel"><h1>🐰 うさぎのジャンプゲーム</h1>
<section class="page active"><h2>1. 移動とジャンプ</h2><div class="item">⬅️ / ➡️ 左右の矢印キー：うさぎを左右に動かします。</div><div class="item">␣ Spaceキー：ジャンプします。足場をうまく渡りましょう！</div></section>
<section class="page"><h2>2. ゴールとアイテム</h2><div class="item">⭐ 星に触れるとゲームクリアです。</div><div class="item">🥕 にんじんを拾うとライフが1つ回復します（最大5）。</div><div class="item">落下するとライフが減ります。ライフがなくなる前にゴールを目指してください。</div></section>
<section class="page"><h2>3. それではスタート！</h2><div class="item">操作説明は以上です。準備ができたら「メインゲームへ」を押してください。メイン画面に移動したあと、「ゲームスタート！」で遊び始められます。</div></section>
<div class="nav"><button id="prev" disabled>← 前へ</button><div class="dots"><span class="active">●</span><span>●</span><span>●</span></div><button id="next">次へ →</button><button id="go" class="finish" style="display:none" onclick="location.href='../メイン/index.html'">メインゲームへ ▶</button></div>
</main><script>
let current=0;const pages=[...document.querySelectorAll('.page')],dots=[...document.querySelectorAll('.dots span')],prev=document.getElementById('prev'),next=document.getElementById('next'),go=document.getElementById('go');function show(){pages.forEach((p,i)=>p.classList.toggle('active',i===current));dots.forEach((d,i)=>d.classList.toggle('active',i===current));prev.disabled=current===0;next.style.display=current===pages.length-1?'none':'inline-block';go.style.display=current===pages.length-1?'inline-block':'none'}prev.onclick=()=>{if(current>0){current--;show()}};next.onclick=()=>{if(current<pages.length-1){current++;show()}};
</script></body></html>
