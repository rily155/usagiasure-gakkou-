<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>OnScroll</title>
  </head>
  <body>
    <div style="height:100px;overflow:auto" onscroll="out.textContent=this.scrollTop">
      <div style="height:500px">スクロール</div>
    </div>
    <p id="out">
    </p>
  </body>
</html>
