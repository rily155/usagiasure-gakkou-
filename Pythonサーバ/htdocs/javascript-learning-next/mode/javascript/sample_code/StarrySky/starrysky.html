<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <style>
      body{margin:0;background:#07152f;overflow:hidden}
      .star{position:absolute;background:white;border-radius:50%;animation:blink 2s infinite alternate}
      @keyframes blink{to{opacity:.2}}
    </style>
  </head>
  <body>
    <script>
      for (let i = 0; i < 100; i++) {
      const s=document.createElement('div');
      s.className='star';
      const size=1+Math.random()*3;
      Object.assign(s.style,{left:Math.random()*100+'vw',top:Math.random()*100+'vh',width:size+'px',height:size+'px',animationDelay:Math.random()*2+'s'});
      document.body.append(s);
      }
    </script>
  </body>
</html>
