<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケモンバトル・バッグ選択モック</title><style>*{box-sizing:border-box}body{margin:0;background:#171e2d;color:#27313c;font-family:Meiryo,sans-serif;display:grid;place-items:center;min-height:100vh}button{font:inherit;cursor:pointer}.wrap{width:min(1000px,97vw)}.top{color:white;display:flex;justify-content:space-between;align-items:center;margin:12px 0}.top button{border:1px solid #778;background:#303c52;color:white;padding:9px 15px;border-radius:8px}.screen{position:relative;width:100%;aspect-ratio:240/158;background-image:url('/storage/games/pokemon/bag/assets/menu1.png'),url('/storage/games/pokemon/bag/assets/menu2.png');background-position:center top,center bottom;background-size:100% 70.2532%,100% 29.7468%;background-repeat:no-repeat;image-rendering:pixelated;overflow:hidden}.bag-image{position:absolute;left:3%;top:18%;width:27%;height:37%;display:grid;place-items:center;pointer-events:none}.bag-image img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.tabs{position:absolute;left:2%;top:1.7%;width:31%;height:13%;display:flex;align-items:center;justify-content:center;gap:1%}.tab{border:0;background:transparent;color:#493923;font-weight:bold;font-size:clamp(9px,1.6vw,17px);padding:3px 4px;border-radius:4px}.tab.active{background:#fff1a6;outline:2px solid #bb8443}.list{position:absolute;left:37%;top:7%;width:57%;height:43%;overflow:auto;display:flex;flex-direction:column;gap:2px;padding:1%}.item{border:0;background:transparent;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:3px 6px;font-size:clamp(11px,1.65vw,18px);min-height:36px}.selected-item-icon{position:absolute;left:2.6%;top:76%;width:12%;height:19%;display:grid;place-items:center;pointer-events:none}.selected-item-icon img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}.item.selected{background:#ffe6a3;outline:2px solid #c48632;border-radius:5px}.item .count{white-space:nowrap}.footer{position:absolute;left:3%;right:3%;bottom:3%;height:16%;display:flex;align-items:center;justify-content:space-between;gap:10px;color:white;font-size:clamp(11px,1.6vw,18px)}.footer button{background:#f8f8f1;border:2px solid #344e60;border-radius:5px;padding:6px 14px;white-space:nowrap}.detail{position:absolute;left:2%;top:59%;width:32%;height:10%;display:flex;align-items:center;justify-content:center}.use{background:#fff0a7;border:2px solid #a76b31;border-radius:5px;padding:4px 16px;font-weight:bold}.use:disabled{opacity:.45}.detail-info{position:absolute;left:16%;right:3%;top:80%;height:16%;display:flex;gap:10px;align-items:center;color:#fff;background:transparent;padding:0;min-width:0}.detail-info img{display:none}.detail-info p{white-space:pre-line;overflow:auto;max-height:100%;margin:0;flex:1;font-size:clamp(11px,1.4vw,18px);line-height:1.35;min-width:0}.detail-info strong{font-size:clamp(11px,1.5vw,19px);white-space:nowrap}.detail-info span{font-size:clamp(10px,1.2vw,16px);white-space:nowrap}.footer{left:16%;right:3%;bottom:auto;top:71%;height:10%;font-size:clamp(11px,1.4vw,18px)}.footer #message{flex:1;min-width:0}.footer button{font-size:clamp(11px,1.4vw,18px);padding:4px 10px}
.overlay{position:fixed;inset:0;background:#0b101cb8;display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.dialog{background:#fff8df;border:5px solid #5d7184;border-radius:15px;padding:22px;max-width:450px;width:100%;text-align:center}.dialog button{padding:10px 20px;margin:8px;border-radius:8px;border:2px solid #52697b;background:white}.dialog button.primary{background:#f3ce72}.help{color:#d7e1ed;font-size:13px;margin:10px 0}@media(max-width:600px){.item{min-height:22px;gap:2px;padding:1px 2px}.list{gap:0}.tab{padding:1px}.detail-info{gap:5px}.detail-info p{flex-basis:auto}}</style></head><body><div class="wrap"><div class="top"><b>ポケモンバトル / バッグ UI モック</b><button id="reset">持ち物をリセット</button></div><div class="screen"><nav class="tabs" id="tabs"></nav><div class="bag-image"><img id="bagImage" src="assets/bag/monster-ball.png" alt="現在のバッグ"></div><section class="list" id="items"></section><div class="selected-item-icon"><img id="selectedItemIcon" alt="選択中のアイテム"></div><div class="detail"><button class="use" id="use">つかう</button></div><div class="footer"><span id="message">アイテムを選んでください。</span><button id="back">もどる</button></div><section class="detail-info"><img id="detailIcon" alt=""><strong id="detailName"></strong><p id="detailDesc"></p><span id="detailCount"></span></section></div><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogButtons"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search), battle=params.get('mode')==='battle';
const categories=[{id:'ball',name:'ボール',icon:'/storage/games/pokemon/bag/assets/bag/monster-ball.png'},{id:'heal',name:'どうぐ',icon:'/storage/games/pokemon/bag/assets/bag/item.png'},{id:'key',name:'たいせつ',icon:'/storage/games/pokemon/bag/assets/bag/keyitem.png'}];
let stock=[],party=[],cat=0,selected=0,loaded=false;
const api='/api/games/pokemon/master/query/items';
const send=(type,extra={})=>parent.postMessage({type,...extra},location.origin);
const ident=x=>String(x.identifier||x.item_identifier||x.itemId||x.id||'');
const qty=x=>Math.max(0,Math.floor(Number(x.quantity??x.qty??0)||0));
function group(x){let v=String(x.category||x.category_identifier||x.pocket||'').toLowerCase();let id=ident(x);if(/ball|ボール/.test(v)||/(^|-)ball$/.test(id))return 'ball';if(/key|たいせつ|key-item/.test(v))return 'key';return 'heal'}
function image(x){const path=String(x.image_path||'');let file=path.split(/[\\/]/).pop();return file?'/storage/games/pokemon/bag/assets/items/'+encodeURIComponent(file):'/storage/games/pokemon/bag/assets/items/'+encodeURIComponent(ident(x))+'.png'}
function visible(){return stock.filter(x=>group(x)===categories[cat].id)}
function current(){return visible()[selected]}
function render(){const c=categories[cat];$('bagImage').src=c.icon;$('tabs').innerHTML='';categories.forEach((x,i)=>{let b=document.createElement('button');b.className='tab'+(i===cat?' active':'');b.textContent=x.name;b.onclick=()=>{cat=i;selected=0;render()};$('tabs').append(b)});
$('items').replaceChildren();visible().forEach((x,i)=>{let b=document.createElement('button');b.className='item'+(i===selected?' selected':'');let name=document.createElement('b');name.textContent=x.name_ja||x.name||ident(x);let count=document.createElement('span');count.className='count';count.textContent='×'+qty(x);b.append(name,count);b.onclick=()=>{selected=i;render()};$('items').append(b)});
let x=current();$('detailName').textContent=x?(x.name_ja||x.name||ident(x)):'';$('detailDesc').textContent=x?(x.description_ja||x.description_en||x.effect_ja||x.effect_en||x.effect||x.description||'説明データはありません。'):(loaded?'このカテゴリの所持品はありません。':'読み込み中…');$('detailCount').textContent=x?'×'+qty(x):'';$('detailIcon').src=x?image(x):'';$('selectedItemIcon').src=x?image(x):'';$('detailIcon').hidden=!x;$('selectedItemIcon').hidden=!x;$('use').disabled=!battle||!x||qty(x)<1||group(x)==='key';$('use').textContent=battle?'つかう':'みる';}
function close(){send('bag-close')}
$('back').onclick=close;$('use').onclick=()=>{let x=current();if(!battle||!x||qty(x)<1||group(x)==='key')return;send('bag-use',{identifier:ident(x),category:group(x),name:x.name_ja||x.name||ident(x),heal:/potion/.test(ident(x))?(/hyper/.test(ident(x))?200:/super/.test(ident(x))?50:20):0})};
$('reset').hidden=true;
document.addEventListener('keydown',e=>{let k=e.key;if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Enter','Escape'].includes(k))e.preventDefault();if(k==='Escape'||k==='x'){close();return}if(k==='ArrowRight'||k==='ArrowLeft'){cat=(cat+(k==='ArrowRight'?1:2))%3;selected=0}else if(k==='ArrowDown')selected=Math.min(visible().length-1,selected+1);else if(k==='ArrowUp')selected=Math.max(0,selected-1);else if(k==='Enter')$('use').click();render()});
window.addEventListener('message',async e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='bag-data')return;party=e.data.party||[];let inventory=e.data.inventory||[];let identifiers=[...new Set(inventory.map(ident).filter(Boolean))];const rows=await Promise.all(identifiers.map(async id=>{try{let r=await fetch(api+'?identifier='+encodeURIComponent(id));if(!r.ok)throw Error(r.status);let j=await r.json();let list=Array.isArray(j)?j:Array.isArray(j.data)?j.data:Array.isArray(j.data?.rows)?j.data.rows:Array.isArray(j.items)?j.items:Array.isArray(j.rows)?j.rows:[];return list.find(v=>ident(v)===id)||null}catch{return null}}));stock=inventory.map(x=>{let data=rows[identifiers.indexOf(ident(x))];return data&&data.image_path?{...data,quantity:qty(x)}:null}).filter(Boolean);loaded=true;render();$('message').textContent=battle?'アイテムを えらんでください。':'もちものを かくにんできます。';});
render();send('bag-ready');
</script></body></html>
